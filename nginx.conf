server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60m;
    }

    # Control de versiones (2026-11-23): index.html y version.json NUNCA se guardan viejos en el
    # navegador — así cada carga trae la versión publicada. Los .js/.css llevan un hash en el nombre
    # (cambia en cada versión), esos sí se pueden guardar mucho tiempo.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /version.json {
        add_header Cache-Control "no-store" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~* \.(?:ico|png|jpg|jpeg|svg|woff2?)$ {
        expires 30d;
        access_log off;
    }
}
