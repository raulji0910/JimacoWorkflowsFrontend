<div class="admin-list">
  <div class="admin-list__header">
    <h2>Roles</h2>
    <button mat-flat-button color="primary" (click)="abrirNuevo()">
      <mat-icon>add</mat-icon>
      Nuevo rol
    </button>
  </div>

  @if (cargando()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <table mat-table [dataSource]="roles()" class="tabla-responsiva">
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let r" data-label="Nombre">{{ r.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef>Descripción</th>
      <td mat-cell *matCellDef="let r" data-label="Descripción">{{ r.descripcion || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let r" data-label="Estado">
        <mat-chip>{{ r.activo ? 'Activo' : 'Inactivo' }}</mat-chip>
      </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let r" data-label="">
        <button mat-icon-button (click)="abrirEditar(r)">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let r; columns: columnas"></tr>

    <tr class="admin-list__vacio-fila" *matNoDataRow>
      <td [attr.colspan]="columnas.length" class="admin-list__vacio">No hay roles creados.</td>
    </tr>
  </table>
</div>
